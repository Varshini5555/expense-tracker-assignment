<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Expense Tracker</h1>
    <nav class="nav" aria-label="Main navigation">
      <button type="button" class="nav__btn nav__btn--active" data-view="expenses" id="nav-expenses">
        Expenses
      </button>
      <button type="button" class="nav__btn" data-view="summary" id="nav-summary">
        Monthly Summary
      </button>
    </nav>
  </header>

  <main class="main">
    <section id="view-expenses" class="view view--active" aria-labelledby="nav-expenses">
      <div class="panel">
        <h2 class="panel__title" id="form-title">Add expense</h2>
        <form id="expense-form" class="form" novalidate>
          <input type="hidden" id="expense-id" name="id" value="">
          <div class="form__group">
            <label class="form__label" for="amount">Amount</label>
            <input class="form__input" type="number" id="amount" name="amount" step="0.01" min="0.01" required placeholder="0.00">
            <p class="form__error" id="error-amount" role="alert" hidden></p>
          </div>
          <div class="form__group">
            <label class="form__label" for="description">Description</label>
            <input class="form__input" type="text" id="description" name="description" maxlength="200" required placeholder="What did you spend on?">
            <p class="form__error" id="error-description" role="alert" hidden></p>
          </div>
          <div class="form__group">
            <label class="form__label" for="date">Date</label>
            <input class="form__input" type="date" id="date" name="date" required>
            <p class="form__error" id="error-date" role="alert" hidden></p>
          </div>
          <div class="form__actions">
            <button type="submit" class="btn btn--primary" id="submit-btn">Add expense</button>
            <button type="button" class="btn btn--secondary" id="cancel-edit-btn" hidden>Cancel</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2 class="panel__title">Your expenses</h2>
        <div id="expense-list-empty" class="empty-state" hidden>
          <p>No expenses yet. Add your first expense above.</p>
        </div>
        <ul id="expense-list" class="expense-list" aria-live="polite"></ul>
      </div>
    </section>

    <section id="view-summary" class="view" aria-labelledby="nav-summary" hidden>
      <div class="panel">
        <h2 class="panel__title">Monthly summary</h2>
        <div class="summary-controls">
          <div class="form__group">
            <label class="form__label" for="summary-year">Year</label>
            <select class="form__input" id="summary-year" aria-label="Summary year"></select>
          </div>
          <div class="form__group">
            <label class="form__label" for="summary-month">Month</label>
            <select class="form__input" id="summary-month" aria-label="Summary month"></select>
          </div>
        </div>
        <p class="summary-total">
          Total: <strong id="summary-total">$0.00</strong>
        </p>
        <div id="summary-empty" class="empty-state" hidden>
          <p>No expenses for this month.</p>
        </div>
        <table class="summary-table" id="summary-table" hidden>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Description</th>
              <th scope="col" class="summary-table__amount">Amount</th>
            </tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Data is stored locally in your browser only.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
