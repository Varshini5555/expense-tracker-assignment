<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Track what you spend, one entry at a time.</p>
    </header>

    <section class="card form-card">
      <h2>Add expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-row">
          <label for="expense-name">Name</label>
          <input
            type="text"
            id="expense-name"
            name="name"
            placeholder="e.g. Groceries"
            autocomplete="off"
            required
          >
        </div>
        <div class="form-row">
          <label for="expense-amount">Amount</label>
          <div class="amount-input">
            <span class="currency">$</span>
            <input
              type="number"
              id="expense-amount"
              name="amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
              required
            >
          </div>
        </div>
        <button type="submit" class="btn-primary">Add expense</button>
      </form>
      <p id="form-error" class="form-error" role="alert" hidden></p>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Your expenses</h2>
        <span id="expense-count" class="badge">0</span>
      </div>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-state" class="empty-state">No expenses yet. Add your first one above.</p>
      <footer class="total-bar">
        <span class="total-label">Total</span>
        <span id="total-amount" class="total-amount">$0.00</span>
      </footer>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
